<!doctype html>

<head>
<meta charset="utf-8">

<title>Budol Bantay (PoC) — Taglish scam-message checker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#5b6570;--hi:#c62828;--mid:#ef6c00;--lo:#f9a825;--none:#2e7d32;--acc:#0b57d0}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.35rem;margin:.4em 0}.tag{font-size:.8rem;color:var(--mute);margin:0 0 10px}
.lang button{border:1px solid #ccd;background:#fff;border-radius:16px;padding:4px 10px;font-size:.85rem}
.lang button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.poc{background:#fff3cd;border:1px solid #f0d58a;border-radius:8px;padding:6px 10px;font-size:.82rem;margin-bottom:10px}
textarea,input{width:100%;font:inherit;padding:10px;border:1px solid #c7ccd3;border-radius:10px;background:#fff}
textarea{min-height:140px;resize:vertical}label{font-size:.85rem;color:var(--mute);display:block;margin:8px 0 4px}
.row{display:flex;gap:8px;margin-top:10px}.btn{flex:1;padding:12px;border-radius:10px;border:0;font-weight:600;font-size:1rem;background:var(--acc);color:#fff}
.btn.sec{background:#e3e7ee;color:var(--ink);flex:0 0 auto}
.privacy{font-size:.78rem;color:var(--mute);margin:6px 0 0}
#result{margin-top:16px}.card{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.verdict{padding:14px 16px;color:#fff}.verdict h2{margin:0;font-size:1.2rem}.verdict p{margin:2px 0 0;font-size:.9rem;opacity:.95}
.meter{height:8px;background:rgba(255,255,255,.35);border-radius:4px;margin-top:8px}.meter i{display:block;height:100%;background:#fff;border-radius:4px}
.sec2{padding:12px 16px;border-top:1px solid #eef0f3}.sec2 h3{margin:0 0 6px;font-size:.95rem}
ul{margin:0;padding-left:20px}li{margin:3px 0}.ev{color:var(--mute);font-size:.8rem}
.disc{font-size:.75rem;color:var(--mute);padding:10px 16px;background:#fafbfc}
details{margin-top:18px;background:#fff;border-radius:12px;padding:8px 12px}summary{font-weight:600;cursor:pointer}
.ex{display:block;width:100%;text-align:left;border:1px solid #e1e5ea;background:#fbfcfd;border-radius:8px;padding:8px;margin:6px 0;font:inherit;font-size:.85rem}
.ex b{color:var(--acc)}footer{font-size:.75rem;color:var(--mute);margin-top:20px}
table{border-collapse:collapse;font-size:.75rem;width:100%}td,th{border:1px solid #ddd;padding:3px}
</style>
</head>
<body>
<main>
<header><h1>🛡️ Budol Bantay</h1>
<div class="lang" role="group" aria-label="Language">
<button data-l="tl" aria-pressed="true">Taglish</button><button data-l="en">EN</button><button data-l="ja">日本語</button></div></header>
<p class="tag" data-i="tagline"></p>
<div class="poc" data-i="pocnote"></div>
<label for="msg" data-i="pasteLabel"></label>
<textarea id="msg" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
<label for="sender" data-i="senderLabel"></label>
<input id="sender" autocomplete="off" placeholder="e.g. GCash / 0917… / +63…">
<div class="row"><button class="btn" id="go" data-i="check"></button><button class="btn sec" id="clr" data-i="clear"></button></div>
<p class="privacy" data-i="privacy"></p>
<div id="result" aria-live="polite"></div>
<details id="exbox"><summary data-i="examples"></summary><p class="ev" data-i="exNote"></p><div id="exlist"></div></details>
<footer data-i="footer"></footer>
</main>
<script>
"use strict";
/* ===================== i18n ===================== */
const T={

footer:"abalol.xyz の非営利プロジェクト。PoC版であり完成版ではありません。",tryEx:"試す"}};

/* ===================== data ===================== */
const SHORTENERS=["bit.ly","tinyurl.com","cutt.ly","is.gd","t.ly","rb.gy","s.id","shorturl.at","tiny.cc","ow.ly","rebrand.ly","goo.su","t.co","buff.ly","shorturl.asia","v.gd","qr.ae","u.to","clck.ru","bitly.ws","lnkd.in","tinyurl.ph"];
const RISKY_TLDS=["top","xyz","icu","vip","cc","buzz","shop","live","click","info","online","site","club","cyou","sbs","cfd","rest","monster","lol","mom","quest","bond","win","work","support","help","app"];
/* Official registrable domains (MUST be re-verified before launch). Being on this list never makes a message "safe". */
const OFFICIAL={gcash:["gcash.com"],maya:["maya.ph","paymaya.com"],bdo:["bdo.com.ph"],bpi:["bpi.com.ph"],landbank:["landbank.com"],metrobank:["metrobank.com.ph"],
unionbank:["unionbankph.com"],securitybank:["securitybank.com"],pnb:["pnb.com.ph"],rcbc:["rcbc.com"],chinabank:["chinabank.ph"],gotyme:["gotyme.com.ph"],
sss:["sss.gov.ph"],dswd:["dswd.gov.ph"],philhealth:["philhealth.gov.ph"],pagibig:["pagibigfund.gov.ph"],bir:["bir.gov.ph"],lto:["lto.gov.ph"],
lbc:["lbcexpress.com"],jnt:["jtexpress.ph"],jtexpress:["jtexpress.ph"],phlpost:["phlpost.gov.ph"],shopee:["shopee.ph"],lazada:["lazada.com.ph"],
cicc:["cicc.gov.ph"],ntc:["ntc.gov.ph"],bsp:["bsp.gov.ph"],meralco:["meralco.com.ph"],globe:["globe.com.ph"],smart:["smart.com.ph"]};
const BRAND_WORDS={ewallet:/\b(g-?cash|gcash|maya|paymaya|shopeepay|gotyme|coins\.ph|grabpay)\b/i,
bank:/\b(bdo|bpi|landbank|metrobank|unionbank|security ?bank|pnb|rcbc|china ?bank|eastwest|psbank|bank|banko)\b/i,
gov:/\b(dswd|sss|philhealth|pag-?ibig|bir|lto|dfa|dole|owwa|4ps|aics|ayuda|tupad|nbi|pnp|gsis|comelec|lgu|barangay)\b/i,
courier:/\b(lbc|j&t|j ?& ?t|jnt|jt express|ninja ?van|flash express|phlpost|philpost|2go|grab ?express|lalamove|dhl|fedex|ups|parcel|package|padala|shipment|courier)\b/i,
shop:/\b(shopee|lazada|tiktok shop|temu|zalora)\b/i};
const TWO_LEVEL=/\.(com|gov|org|net|edu|mil)\.ph$/;
function regDomain(h){h=h.toLowerCase().replace(/^www\./,"");const p=h.split(".");if(TWO_LEVEL.test(h))return p.slice(-3).join(".");return p.slice(-2).join(".");}

/* ===================== rules =====================
   Each rule: id, w (weight), cat (advice category), test(ctx) -> evidence string|null */
const R=(re)=>(c)=>{const m=c.t.match(re);return m?m[0]:null};
const RULES=[
{id:"shortener",w:25,cat:"link",test:c=>{const s=c.urls.find(u=>SHORTENERS.includes(u.reg)||SHORTENERS.includes(u.host));return s?s.host:null}},
{id:"lookalike",w:35,cat:"link",test:c=>{for(const u of c.urls){for(const k in OFFICIAL){const kk=k.replace("jnt","j-?n?t");if(new RegExp(kk,"i").test(u.host.replace(/[^a-z0-9]/g,""))&&!OFFICIAL[k].includes(u.reg))return u.host;} if(/gov-?ph|govph/.test(u.host)&&!u.host.endsWith(".gov.ph"))return u.host;}return null}},
{id:"riskytld",w:15,cat:"link",test:c=>{const u=c.urls.find(u=>RISKY_TLDS.includes(u.host.split(".").pop()));return u?u.host:null}},
{id:"rawip",w:25,cat:"link",test:c=>{const u=c.urls.find(u=>/^\d{1,3}(\.\d{1,3}){3}$/.test(u.host)||u.host.includes("xn--"));return u?u.host:null}},
{id:"brandlink",w:20,cat:"link",test:c=>c.urls.length&&(BRAND_WORDS.ewallet.test(c.t)||BRAND_WORDS.bank.test(c.t))?c.urls[0].host:null},
{id:"link",w:10,cat:"link",test:c=>c.urls.length?c.urls[0].host:null},
{id:"credential",w:40,cat:"cred",test:c=>{const re=/\b(paki-?send|i-?send|send|ibigay|bigay|i-?reply|reply|i-?type|ilagay|enter|provide|share|sabihin|i-?forward|forward)\b[^.!?\n]{0,40}\b(otp|one[- ]time pin|mpin|pin|password|passcode|cvv|card number|verification code|code)\b|\b(otp|mpin|cvv|password|verification code)\b[^.!?\n]{0,30}\b(paki-?send|i-?send|ibigay|i-?reply|reply|send|ilagay|enter)\b/gi;for(const m of c.t.matchAll(re)){const pre=c.t.slice(Math.max(0,m.index-25),m.index);if(/\b(never|do not|don'?t|huwag|wag|hindi)\b[^.!?\n]*$/i.test(pre+m[0].split(/\s/)[0]+" ")||/^(share|sabihin)\b/i.test(m[0])&&/\b(never|do not|don'?t|huwag|wag)\s*(ever\s*)?$/i.test(pre))continue;return m[0]}return null}},
{id:"verifyacct",w:15,cat:"cred",test:R(/\b(i-?verify|verify|i-?update|update|confirm|i-?confirm|re-?activate|i-?activate|unlock|login|log in|mag-?login)\b[^.!?\n]{0,40}\b(account|info|information|details|kyc|identity|card|wallet)\b/i)},
{id:"threat",w:15,cat:"cred",test:R(/\b(suspend(ed)?|deactivat\w*|ma-?deactivate|na-?lock|ma-?lock|locked|blocked|ma-?block|restrict\w*|na-?hold|frozen|i-?freeze|closed|terminated|ma-?forfeit|forfeit\w*)\b/i)},
{id:"urgency",w:15,cat:"gen",test:R(/\b(within \d+ ?(hours?|hrs?|minutes?|mins?|oras|araw)|\d+ ?(hrs?|oras)|ngayon din|ngayong araw|agad|agad-agad|asap|urgent|immediately|final (notice|warning)|huling paalala|last chance|today only|expire[sd]?|mag-?e-?expire|bago mag|before (midnight|\w+ \d+)|limited slots?)\b/i)},
{id:"prize",w:25,cat:"prize",test:R(/\b(congratulations|congrats|nanalo|panalo|you (have )?won|winner|raffle|napili ka|selected|lucky|claim (your|ang) (prize|premyo|reward)|premyo|grand prize|jackpot)\b/i)},
{id:"feeToClaim",w:25,cat:"pay",test:c=>/\b(processing|handling|redelivery|delivery|release|insurance|clearance|membership|registration|activation|verification|tax|shipping|service|customs) fee\b|\bfee\b|\bbayad\b|magbayad|bayaran/i.test(c.t)&&(c.hasPrize||c.hasLoan||c.hasJob||c.hasParcel)?(c.t.match(/\b\w+ fee\b|magbayad|bayad/i)||[""])[0]:null},
{id:"sendMoney",w:20,cat:"pay",test:R(/\b(pa-?send|magpadala|ipadala|i-?send|send|transfer|deposit|i-?deposit|pa-?load|load|cash ?in|top ?up|recharge|bayaran)\b[^.!?\n]{0,50}(₱|php|p\s?\d|\d{3,}|gcash|maya|account|0?9\d{2})/i)},
{id:"personalAcct",w:15,cat:"pay",test:R(/\b(gcash|maya)\b[^.!?\n]{0,15}(0|\+63)9[\dx]{2}[\s-]?[\dx]{3}[\s-]?[\dx]{4}/i)},
{id:"job",w:20,cat:"job",test:R(/\b(hiring|part-?time|work from home|wfh|online job|home-?based|no experience|walang experience|daily (pay|salary)|commission|kumita|earn)\b/i)},
{id:"highpay",w:15,cat:"job",test:R(/(₱|php|p)\s?[\d,]{3,}\s?(-|–|to)?\s?(₱|php|p)?\s?[\d,]*\s?\/?\s?(per )?(day|araw|daily|hour|oras|isang araw)/i)},
{id:"task",w:30,cat:"job",test:R(/\b(like|follow|rate|review|subscribe|mag-?like|mag-?review)\b[^.!?\n]{0,40}\b(product|video|page|task|order|hotel|app)s?\b|\btask\b[^.!?\n]{0,40}\b(recharge|deposit|unlock|top ?up)\b/i)},
{id:"offplatform",w:15,cat:"gen",test:R(/\b(telegram|whatsapp|wechat|signal|line app)\b|@[a-z0-9_]{4,}\b/i)},
{id:"parcel",w:25,cat:"parcel",test:c=>c.hasParcel&&/\b(on hold|naka-?hold|na-?hold|failed (delivery|attempt)|hindi (ma-?deliver|na-?deliver)|incomplete address|kulang (ang )?address|wrong address|unpaid|customs|redelivery|ibalik)\b/i.test(c.t)?"parcel/hold":null},
{id:"loan",w:25,cat:"loan",test:R(/\b(loan|utang|pautang|cash advance|instant cash|pre-?approved|approved na|no collateral|walang collateral|low interest)\b/i)},
{id:"ayuda",w:20,cat:"gov",test:c=>BRAND_WORDS.gov.test(c.t)&&/\b(ayuda|cash assistance|financial assistance|subsidy|benefit|claim|i-?claim|register|mag-?register|listahan|qualified|beneficiar\w*|payout)\b/i.test(c.t)?(c.t.match(BRAND_WORDS.gov)||[""])[0]:null},
{id:"invest",w:30,cat:"invest",test:R(/\b(guaranteed|garantisado|double your|doble|daily profit|\d+% (daily|weekly|per day|kada araw)|passive income|usdt|bitcoin|crypto|forex|trading|investment|invest|paluwagan|vip group)\b/i)},
{id:"family",w:25,cat:"family",test:R(/\b(bagong number ko|new number ko|new number|nasira (ang )?phone|nawala (ang )?(phone|cellphone)|this is your (son|daughter)|si [A-Z][a-z]+ (ito|'to)|emergency lang|na-?ospital|naaksidente|nahuli ng pulis)\b/i)},
{id:"secrecy",w:15,cat:"gen",test:R(/\b(huwag (mo )?(munang |muna )?(sabihin|ipaalam)|wag (mo )?(muna )?sabihin|keep (this )?(confidential|secret)|don'?t tell|atin-atin lang)\b/i)},
{id:"remote",w:30,cat:"cred",test:R(/\b(anydesk|teamviewer|rustdesk|quicksupport|\.apk|i-?download ang app|download (this|the) app|install (this|the) app)\b/i)},
{id:"qr",w:10,cat:"link",test:R(/\b(scan (the |this )?qr|i-?scan ang qr|qr code)\b/i)},
{id:"replyYes",w:10,cat:"gen",test:R(/\b(reply|i-?reply|text back)\s+(yes|oo|interested|1|ok)\b/i)},
{id:"senderMobile",w:20,cat:"gen",test:c=>c.sender&&/^(\+?63|0)9[\dx]{9}$/i.test(c.sender.replace(/[\s-]/g,""))&&[BRAND_WORDS.ewallet,BRAND_WORDS.bank,BRAND_WORDS.gov,BRAND_WORDS.courier].some(b=>b.test(c.t.slice(0,60)))?c.sender:null},
{id:"fakePermit",w:10,cat:"prize",test:R(/\b(dti (permit|fair trade permit)|per dti|dti-?fto)\b/i)},
];
/* Mitigator: standard OTP notice ("never share") with no link and no request */
const NEG=[{id:"otpNotice",w:-25,test:c=>/\b(never|do not|don'?t|huwag|wag) (ever )?(share|ibigay|sabihin|i-?share)\b[^.!?\n]{0,30}\b(otp|pin|code|password)/i.test(c.t)&&!c.urls.length?"never share":null}];

const FLAG={ /* explanations [tl,en,ja] */
shortener:["May shortened link (hal. bit.ly). Tinatago nito kung saan ka talaga dadalhin.","Contains a shortened link (e.g. bit.ly) that hides the real destination.","短縮URL(bit.ly等)があり、本当の行き先が隠されています。"],
lookalike:["Ang link ay nagpapanggap na brand/gobyerno pero HINDI official domain.","The link imitates a brand/government name but is NOT the official domain.","ブランドや政府を装ったリンクですが、公式ドメインではありません。"],
riskytld:["Ang link ay gumagamit ng domain ending na madalas gamitin sa scam (.top, .xyz, .icu…).","The link uses a domain ending often abused by scammers (.top, .xyz, .icu…).","詐欺でよく使われるドメイン(.top/.xyz/.icu等)です。"],
rawip:["Kakaibang link (IP address o punycode).","Unusual link (raw IP address or punycode look-alike).","不自然なリンク(IPアドレスやpunycode)です。"],
brandlink:["Nagbanggit ng bangko/e-wallet AT may link. Ang GCash, Maya at mga bangko ay hindi nagpapadala ng link para mag-login (AFASA).","Mentions a bank/e-wallet AND includes a link. GCash, Maya and banks don't send login links by SMS (AFASA rules).","銀行/電子ウォレット名とリンクが同時にあります。GCashやMaya、銀行はSMSでログイン用リンクを送りません(AFASA)。"],
link:["May link sa mensahe. Huwag i-click kung hindi ka sigurado.","The message contains a link. Don't tap it unless you're sure.","リンクが含まれています。確信がなければ開かないでください。"],
credential:["Humihingi ng OTP / MPIN / password / code. Walang lehitimong kumpanya ang hihingi nito.","Asks for your OTP / MPIN / password / code. No legitimate company asks for these.","OTP・MPIN・パスワード等を求めています。正規の企業は絶対に求めません。"],
verifyacct:["Pinapa-verify o pinapa-update ang account mo.","Asks you to verify/update your account details.","アカウントの確認・更新を求めています。"],

/* ===================== engine ===================== */
const URL_RE=/\b((?:https?:\/\/)?(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:[a-z]{2,24}|xn--[a-z0-9-]+)(?::\d+)?(?:\/[^\s<>"']*)?)|\bhttps?:\/\/\d{1,3}(?:\.\d{1,3}){3}[^\s]*/gi;
const NOT_URL=/^(e\.g|i\.e|p\.s|a\.m|p\.m|etc|mr|ms|dr|st)\b/i;
function extractUrls(t){const out=[];for(const m of t.matchAll(URL_RE)){let s=m[0].replace(/[.,;:!?)]+$/,"");if(NOT_URL.test(s))continue;let h=s.replace(/^https?:\/\//i,"").split(/[\/:?#]/)[0].toLowerCase();
 const tld=h.split(".").pop();if(!/^\d+$/.test(tld)&&!/^(com|net|org|ph|gov|info|xyz|top|icu|vip|cc|buzz|shop|live|click|online|site|club|ly|gd|id|io|co|me|app|link|to|in|at|ws|ru|asia|cyou|sbs|cfd|rest|monster|lol|mom|quest|bond|win|work|support|help|us|uk|sg|my|cn|de|xn--.*)$/.test(tld))continue;
 out.push({raw:s,host:h,reg:regDomain(h)});}return out;}
function analyze(text,sender){
 const t=text.normalize("NFKC").replace(/[\u200b-\u200d\ufeff]/g,"");
 const c={t,sender:(sender||"").trim(),urls:extractUrls(t)};
 c.hasPrize=/\b(nanalo|panalo|won|winner|raffle|prize|premyo|congratulations)\b/i.test(t);c.hasLoan=/\b(loan|utang|pautang)\b/i.test(t);
 c.hasJob=/\b(hiring|job|trabaho|part-?time|task)\b/i.test(t);c.hasParcel=BRAND_WORDS.courier.test(t);
 const hits=[];let s=0;
 for(const r of RULES){let ev=null;try{ev=r.test(c)}catch(e){} if(ev){hits.push({id:r.id,w:r.w,cat:r.cat,ev:String(ev).slice(0,60)});s+=r.w;}}
 // "link" only counts when no stronger link rule fired
 if(hits.some(h=>["shortener","lookalike","rawip"].includes(h.id))){const i=hits.findIndex(h=>h.id==="link");if(i>=0){s-=hits[i].w;hits.splice(i,1);}}
 for(const n of NEG){const ev=n.test(c);if(ev&&!hits.some(h=>["credential","sendMoney","remote"].includes(h.id))){hits.push({id:n.id,w:n.w,cat:"gen",ev});s+=n.w;}}
 // combo boosts: classic kill-chains
 const has=id=>hits.some(h=>h.id===id);
 if(has("credential")&&(has("threat")||has("urgency")))s+=10;
 if(has("lookalike")&&has("verifyacct"))s+=10;
 s=Math.max(0,Math.min(100,s));
 const level=s>=60?"hi":s>=30?"mid":s>=10?"lo":"none";
 const cats=[...new Set(hits.map(h=>h.cat))];
 return {score:s,level,hits:hits.sort((a,b)=>b.w-a.w),cats,urls:c.urls};
}

/* ===================== UI ===================== */
let L="tl",last=null;const $=s=>document.querySelector(s);
const COL={hi:"#c62828",mid:"#ef6c00",lo:"#b26a00",none:"#2e7d32"};const LI={tl:0,en:1,ja:2};
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function applyLang(){document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T[L][e.dataset.i]);document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));document.documentElement.lang=L==="tl"?"fil":L;$("#msg").placeholder=L==="ja"?"例: 「GCash: アカウントがロックされました…」":"hal. \"GCash: Ang account mo ay na-lock…\"";renderEx();if(last)render(last);}
function render(r){last=r;const i=LI[L];const adv=[ADV.always[i]];
 const order=["cred","pay","job","parcel","gov","invest","family","loan"];for(const k of order)if(r.cats.includes(k)&&ADV[k])adv.push(ADV[k][i]);
 if(r.level!=="none")adv.push(ADV.report[i]);else adv.push(ADV.report[i]);
 $("#result").innerHTML=`<div class="card"><div class="verdict" style="background:${COL[r.level]}"><h2>${T[L][r.level]}</h2><p>${T[L][r.level+"Sub"]}</p>
 <div class="meter" title="${T[L].score} ${r.score}/100"><i style="width:${Math.max(3,r.score)}%"></i></div><p>${T[L].score}: ${r.score}/100</p></div>
 ${r.hits.length?`<div class="sec2"><h3>${T[L].why}</h3><ul>${r.hits.map(h=>`<li>${esc(FLAG[h.id][i])} <span class="ev">“${esc(h.ev)}”</span></li>`).join("")}</ul></div>`:""}
 <div class="sec2"><h3>${T[L].todo}</h3><ul>${adv.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>
 <div class="sec2"><button class="btn" id="dl">${T[L].share}</button></div>
 <div class="disc">${T[L].disc}</div></div>`;
 $("#dl").onclick=()=>shareImg(r);}
function wrap(ctx,text,x,y,maxW,lh){let line="";const words=L==="ja"?[...text]:text.split(" ");const sep=L==="ja"?"":" ";for(const w of words){const test=line?line+sep+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w}else line=test}ctx.fillText(line,x,y);return y+lh}
function shareImg(r){const i=LI[L],W=1080,H=1080,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
 x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle=COL[r.level];x.fillRect(0,0,W,300);x.fillStyle="#fff";x.font="bold 40px system-ui,sans-serif";x.fillText("🛡️ Budol Bantay",60,80);
 x.font="bold 54px system-ui,sans-serif";let y=wrap(x,T[L][r.level],60,170,W-120,64);x.font="34px system-ui,sans-serif";x.fillText(`${T[L].score}: ${r.score}/100`,60,Math.min(y+10,285));
 x.fillStyle="#1b1f24";x.font="bold 38px system-ui,sans-serif";y=380;x.fillText(T[L].why,60,y);y+=56;x.font="32px system-ui,sans-serif";
 for(const h of r.hits.slice(0,5)){y=wrap(x,"• "+FLAG[h.id][i],60,y,W-120,42)+8;if(y>860)break;}
 x.fillStyle="#0b57d0";x.font="bold 32px system-ui,sans-serif";x.fillText("CICC Hotline 1326",60,960);x.fillStyle="#5b6570";x.font="26px system-ui,sans-serif";x.fillText("abalol.xyz/budol-bantay  •  not affiliated with any agency",60,1010);
 cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="budol-bantay-result.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},"image/png");}

$("#go").onclick=run;$("#clr").onclick=()=>{$("#msg").value="";$("#sender").value="";$("#result").innerHTML="";last=null};
